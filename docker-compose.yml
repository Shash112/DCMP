services:
  postgres:
    image: postgres:16-alpine
    container_name: dcmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcmp_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dcmp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcmp_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dcmp_user} -d ${POSTGRES_DB:-dcmp_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dcmp-network

  redis:
    image: redis:7-alpine
    container_name: dcmp-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dcmp-network

volumes:
  postgres_data:
    name: dcmp-postgres-data
  redis_data:
    name: dcmp-redis-data

networks:
  dcmp-network:
    name: dcmp-network
    driver: bridge

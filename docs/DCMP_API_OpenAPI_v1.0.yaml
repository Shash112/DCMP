components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found in caller's authorized scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State conflict or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - success
      - data
    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
        timestamp: &id007
          type: string
          format: date-time
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        nextCursor:
          type: string
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - success
      - error
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          type: string
      required:
      - code
      - message
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - user
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        deviceId:
          type: string
        deviceName:
          type: string
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
      required:
      - refreshToken
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 12
      required:
      - token
      - newPassword
    User:
      type: object
      properties:
        id: &id006
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INVITED
          - SUSPENDED
        roles:
          type: array
          items:
            type: string
      required:
      - id
      - email
    OrganizationSummary:
      type: object
      properties:
        id: *id006
        name:
          type: string
        slug:
          type: string
        timeZone:
          type: string
    Organization:
      type: object
      properties:
        id: *id006
        name:
          type: string
        legalName:
          type: string
        slug:
          type: string
        timeZone:
          type: string
        defaultLanguage:
          type: string
        status:
          type: string
        branding:
          type: object
          additionalProperties: true
    LocationCreateRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        address:
          type: object
          additionalProperties: true
        timeZone:
          type: string
      required:
      - name
    DepartmentCreateRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        locationId: *id006
      required:
      - name
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roleIds:
          type: array
          items: *id006
        departmentId: *id006
        locationIds:
          type: array
          items: *id006
      required:
      - email
      - firstName
    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:

name: DCMP CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting (Prettier)
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Build Shared Workspace Packages
        run: pnpm run build:packages

      - name: Run TypeScript Checks
        run: pnpm run typecheck

  build-node-apps:
    name: Build NestJS & Next.js Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Workspace Packages
        run: pnpm run build:packages

      - name: Build Applications (NestJS & Next.js)
        run: pnpm run build:apps

  test-flutter-mobile:
    name: Analyze & Test Flutter Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile-app
          flutter pub get

      - name: Run Flutter Analyzer
        run: |
          cd apps/mobile-app
          flutter analyze

      - name: Run Flutter Tests
        run: |
          cd apps/mobile-app
          flutter test
